[project]
name = "python-chrome-crawler"
version = "0.1.0"
description = "Selenium Chrome crawler with bundled consent-dismiss and adblock extensions, returns rendered HTML"
requires-python = ">=3.11"
dependencies = [
    "selenium>=4.20",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chrome_crawler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
